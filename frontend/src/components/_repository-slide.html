<article class="repo-window swiper-slide">
  <div class="window-top">
    <i class="dot"></i>
    <i class="dot"></i>
    <i class="dot"></i>
    <span class="window-title">@@repositoryPath</span>
  </div>
  <a class="repo-head" href="@@repositoryHref" target="_blank" rel="noopener noreferrer">
    <div>
      <span class="kicker">REPOSITÓRIO EM EVOLUÇÃO</span>
      <h3>@@repositoryTitle <i data-lucide="external-link"></i></h3>
    </div>
    <span class="status">● ativo</span>
  </a>
  <div class="file">
    <i data-lucide="folder"></i>
    <span>components</span>
    <time>interface</time>
  </div>
  <div class="file">
    <i data-lucide="folder"></i>
    <span>pages</span>
    <time>estrutura</time>
  </div>
  <div class="file">
    <i data-lucide="file-code-2"></i>
    <span>scripts.js</span>
    <time>JavaScript</time>
  </div>
  <div class="file">
    <i data-lucide="palette"></i>
    <span>styles.css</span>
    <time>experiência</time>
  </div>
  <div class="commit"><b>TechVT</b> criando, testando e aprendendo a cada versão</div>
</article>
